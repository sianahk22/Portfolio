# Configuration Netlify : lue automatiquement au déploiement.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# En-têtes de sécurité appliqués à toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self' mailto:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Les fichiers générés par Vite ont un nom unique : on peut les garder en cache longtemps.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# L'adresse technique Netlify redirige vers le domaine officiel (évite le contenu en double).
[[redirects]]
  from = "https://anaisweb.netlify.app/*"
  to = "https://anaisweb.tech/:splat"
  status = 301
  force = true
