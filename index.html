<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anaïs Bay — Développeuse web</title>
    <meta name="description"
        content="Je conçois des sites web modernes, responsives et automatisés pour les indépendants, petites entreprises et projets personnels." />
    <meta name="author" content="Anaïs Bay" />
    <link rel="canonical" href="https://anaisweb.tech/" />
    <meta name="theme-color" content="#6D28D9" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aperçu lors d'un partage (LinkedIn, WhatsApp, X…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Anaïs Bay" />
    <meta property="og:url" content="https://anaisweb.tech/" />
    <meta property="og:title" content="Anaïs Bay — Développeuse web" />
    <meta property="og:description"
        content="Sites web modernes, responsives et automatisés. Sur devis, à Paris et à distance." />
    <meta property="og:image" content="https://anaisweb.tech/images/og-anais-bay.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anaïs Bay, développeuse web : sites web modernes, responsives et automatisés" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Données structurées pour les moteurs de recherche -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Anaïs Bay",
        "jobTitle": "Développeuse web",
        "description": "Sites web modernes, responsives et automatisés.",
        "url": "https://anaisweb.tech/",
        "image": "https://anaisweb.tech/images/portrait-anais-bay-480.jpg",
        "email": "mailto:bonjour@anaisweb.tech",
        "address": { "@type": "PostalAddress", "addressLocality": "Paris", "addressCountry": "FR" },
        "knowsLanguage": ["fr", "ar", "en"],
        "sameAs": ["https://github.com/sianahk22", "https://www.linkedin.com/in/anais-ben-chabane"]
    }
    </script>
</head>

<body>
    <!--
        Copie cachée du formulaire de contact : Netlify lit ce HTML au déploiement
        pour détecter le formulaire. Elle doit contenir les mêmes champs que Contact.jsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input name="bot-field" />
        <input name="nom" />
        <input name="email" type="email" />
        <input name="besoin" />
        <input name="budget" />
        <input name="delai" />
        <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <noscript>
        <p>
            Anaïs Bay, développeuse web à Paris : sites web modernes, responsives et automatisés.
            Ce site a besoin de JavaScript. Contact : <a href="mailto:bonjour@anaisweb.tech">bonjour@anaisweb.tech</a>
        </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
